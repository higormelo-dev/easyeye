server {
    listen 80;
    server_name _;
    root /var/www/html/app/public;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 64M;
    client_body_buffer_size 512k;

    # DNS interno do Docker — re-resolve o upstream a cada 10s.
    # Obrigatório para que o nginx não cache o IP do container app quando ele
    # for recriado por `docker compose up -d --build`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Laravel Reverb (WebSocket em /app, API de broadcast em /apps) — mesma
    # porta do app, upgrade de conexão pro container easyeye_reverb.
    location ~ ^/apps?(/|$) {
        set $reverb easyeye_reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 120s;
        proxy_pass http://$reverb:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Variável força resolução DNS por request (não cacheia IP do container).
        set $phpfpm easyeye_app;
        fastcgi_pass $phpfpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
