; OPcache config para dev em container.
; - validate_timestamps=1 + revalidate_freq=0 → revalida em TODA request.
;   Garante que mudanças em .php (controllers, services, models, blade compilada)
;   sejam refletidas no próximo refresh do navegador sem `php-fpm reload`.
;   Em produção, mude revalidate_freq=60 e considere validate_timestamps=0
;   para máxima performance (precisa de deploy com `opcache_reset`).
; - max_accelerated_files alto absorve o tamanho da árvore Vue + Inertia + Yajra.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.fast_shutdown=1
