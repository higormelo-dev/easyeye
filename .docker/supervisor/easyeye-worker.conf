[program:easyeye-worker-default]
process_name=%(program_name)s_%(process_num)02d
; Filas consumidas por este worker — TODA fila que a aplicação usa precisa
; estar listada aqui, senão os jobs dela ficam parados pra sempre na tabela
; `jobs` (achado via auditoria de encerramento, EE-09: tiss-xml/tiss-send/
; tiss-returns — ver config/tiss.php "queues" — nunca apareciam nesta
; lista; TissWorkflowService/ReceiveTissResponseService despachavam pra
; filas que nenhum worker lia).
command=php /var/www/html/app/artisan queue:work %(ENV_SUPERVISOR_QUEUE_CONNECTION)s --queue=default,high,tiss-xml,tiss-send,tiss-returns --timeout=90 --tries=3 --sleep=3 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=%(ENV_SUPERVISOR_WORKER_USER)s
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/easyeye-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; --timeout=90 acima é só o limite PADRÃO: um job com $timeout próprio
; (ex.: ProcessCovenantImportJob/ProcessMedicineImportJob = 900s,
; ProcessCid10/Doctor/Patient/ScheduleImportJob = 600s,
; GenerateTissBatchXmlJob/ProcessTissReturnJob = 120s) usa o DELE, não este
; — Illuminate\Queue\Worker::timeoutForJob() dá precedência ao timeout do
; job. stopwaitsecs abaixo é o que de fato precisa cobrir o maior deles:
; no SIGTERM de um restart/deploy, Supervisor espera só até aqui antes do
; SIGKILL — menos que isso mata um import legítimo no meio (achado via
; auditoria de encerramento, EE-09). 960 = 900 (maior timeout hoje) + 60s
; de margem. Se algum job novo passar de 900s, subir aqui E em
; config/queue.php (retry_after das conexões 'database' E 'redis' — tem que
; ficar SEMPRE acima do maior timeout, senão outro worker pega o MESMO job
; antes da 1ª tentativa, legítima, terminar).
stopwaitsecs=960
