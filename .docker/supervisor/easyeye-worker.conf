; Três programas, 3 processos, uma fila FIFO para cada tipo de trabalho (docs/internal/runbooks/filas-workers.md):
;
;   fast-critical — `critical` PRIMEIRO (OTP do cadastro, mensagem recebida do WhatsApp, webhook de pagamento), depois
;                   `default` e as três filas TISS. Jobs de até 180 s (IA); conexão `redis`, retry_after=240.
;   fast-tiss     — as TRÊS filas TISS primeiro (lote esparso de 90–120 s), depois `default` e, por último, `critical`.
;                   É o que ATENUA a starvation: uma rajada sustentada de `critical` (ex.: inbound do WhatsApp) prende o
;                   fast-critical, mas TISS (aqui na frente) e `default` (aqui logo depois da fila de volume baixo) sempre
;                   têm um consumidor; e `critical` continua com prioridade no fast-critical. Cada fila tem um consumidor
;                   que a prioriza ou a atende logo após uma fila de volume baixo.
;                   Risco residual (prioridade fixa, aceite do dono pendente em 22/10): com `critical` E `tiss-xml` cheias ao
;                   mesmo tempo, `default`, `tiss-send` e `tiss-returns` param até uma esvaziar — ver "Risco residual" em
;                   docs/internal/runbooks/filas-workers.md (correção definitiva: Horizon com balance=auto).
;   bulk          — `bulk` (6 importações, sync de catálogos, posologia), 600–900 s por job, num processo só.
;                   Um import de 15 min não segura mais o OTP nem o webhook de pagamento.
;
; A CONEXÃO é argumento posicional do `queue:work` (Laravel 12 não tem opção de conexão). O fast usa
; SUPERVISOR_QUEUE_CONNECTION (compose: QUEUE_CONNECTION_DOCKER). O bulk usa SUPERVISOR_BULK_CONNECTION, que o
; entrypoint (.docker/php/entrypoint.sh) deriva da conexão efetiva: `redis` -> `redis-bulk` (retry_after 960); `database`
; -> `database` (fast e bulk leem a mesma tabela `jobs`, retry_after 960 >= 900). TODA fila que a aplicação usa precisa
; estar nas listas abaixo, senão os jobs dela ficam parados pra sempre (achado EE-09: tiss-xml/tiss-send/tiss-returns
; — config/tiss.php "queues" — não eram lidas por nenhum worker). Os testes WorkerTopologyTest e QueueWorkerSmokeTest
; travam essas listas contra as filas configuradas.

[program:easyeye-worker-fast-critical]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/app/artisan queue:work %(ENV_SUPERVISOR_QUEUE_CONNECTION)s --queue=critical,default,tiss-xml,tiss-send,tiss-returns --sleep=1 --timeout=190 --tries=3 --memory=256 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=%(ENV_SUPERVISOR_WORKER_USER)s
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/easyeye-fast-critical.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; --timeout=190 é o limite PADRÃO do fast: acima do maior job dele (180 s, IA); um job com $timeout próprio (WhatsApp
; 150 s, TISS 90–120 s) usa o DELE — Illuminate\Queue\Worker::timeoutForJob() dá precedência ao timeout do job.
; stopwaitsecs é o que o Supervisor espera depois do SIGTERM (restart/deploy) antes do SIGKILL: precisa cobrir o maior
; job (180 s) com folga — menos que isso mata um job legítimo no meio. 240 = o retry_after da conexão `redis`. Job novo
; acima de 180 s: subir o retry_after de `redis` em config/queue.php e este stopwaitsecs, ou mover o job para o bulk.
stopwaitsecs=240

[program:easyeye-worker-fast-tiss]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/app/artisan queue:work %(ENV_SUPERVISOR_QUEUE_CONNECTION)s --queue=tiss-xml,tiss-send,tiss-returns,default,critical --sleep=1 --timeout=190 --tries=3 --memory=256 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=%(ENV_SUPERVISOR_WORKER_USER)s
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/easyeye-fast-tiss.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; Mesmos --timeout/stopwaitsecs do fast-critical (ver comentário acima).
stopwaitsecs=240

[program:easyeye-worker-bulk]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/app/artisan queue:work %(ENV_SUPERVISOR_BULK_CONNECTION)s --queue=bulk --sleep=3 --timeout=900 --tries=1 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=%(ENV_SUPERVISOR_WORKER_USER)s
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/easyeye-bulk.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; --timeout=900 = o maior job bulk (ProcessCovenantImportJob/ProcessMedicineImportJob); os de 600 s (Cid10, Doctor,
; Patient, Schedule) usam o $timeout deles. --tries=1: os imports têm $tries=1 (a posologia tem 3 e o do job vale mais).
; stopwaitsecs=960 cobre o maior job (900 s) com folga: o SIGTERM de um deploy espera o import terminar. O retry_after da
; conexão do bulk (`redis-bulk` ou `database`: 960 nas duas) fica acima dos 900 s. Se algum job novo passar de 900 s,
; subir AQUI, no --timeout e em config/queue.php (retry_after SEMPRE acima do maior timeout, senão outro worker pega o
; MESMO job antes de a 1ª tentativa, legítima, terminar).
stopwaitsecs=960
