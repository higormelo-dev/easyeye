services:
  easyeye_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html/app
    volumes:
      - ./:/var/www/html/app
    depends_on:
      - easyeye_redis
      - easyeye_nginx
    networks:
      - easyeye-network
    healthcheck:
      test: curl --fail easyeye_app:8080/health || exit 1
      interval: 5s
      retries: 5
      start_period: 20s
      timeout: 10s

  easyeye_nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/app
      - ./.docker/nginx/:/etc/nginx/conf.d/
    networks:
      - easyeye-network

  easyeye_queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html/app
    command: "php artisan queue:work --tries=3"
    volumes:
      - .:/var/www/html/app
    depends_on:
      - easyeye_redis
      - easyeye_app
    networks:
      - easyeye-network
    healthcheck:
      test: curl --fail easyeye_queue:8080/health || exit 1
      interval: 5s
      retries: 5
      start_period: 20s
      timeout: 10s

  easyeye_redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - easyeye-network
    volumes:
      - ./.docker/redis/data:/var/lib/redis/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 5s
      retries: 5
      start_period: 20s
      timeout: 10s

networks:
  easyeye-network:
    driver: bridge
