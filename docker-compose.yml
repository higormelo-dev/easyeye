name: easyeye

# PostgreSQL e Redis rodam no Ubuntu host, não no Docker.
# Os containers acessam o host via "host.docker.internal" (mapeado por extra_hosts abaixo).
#
# Configure o .env com:
#   DB_HOST=host.docker.internal
#   DB_PORT=5432
#   REDIS_HOST=host.docker.internal
#   REDIS_PORT=6379
#
# Para usar serviços em container no futuro, descomente os blocos
# marcados com [DOCKER-DB] e [DOCKER-REDIS] e adicione de volta
# os depends_on correspondentes nos serviços app, worker e artisan.

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    APP_USER: ${APP_USER:-easyeye}
    UID: ${UID:-1000}
    GID: ${GID:-1000}

services:
  app:
    build: *app-build
    container_name: easyeye_app
    restart: unless-stopped
    working_dir: /var/www/html/app
    volumes:
      - ./:/var/www/html/app
    environment:
      QUEUE_CONNECTION: ${QUEUE_CONNECTION_DOCKER:-database}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - easyeye-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w1 127.0.0.1 9000 || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  worker:
    build: *app-build
    container_name: easyeye_worker
    restart: unless-stopped
    working_dir: /var/www/html/app
    volumes:
      - ./:/var/www/html/app
      - ./.docker/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf:ro
      - ./.docker/supervisor/easyeye-worker.conf:/etc/supervisor/conf.d/easyeye-worker.conf:ro
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    environment:
      APP_USER: ${APP_USER:-easyeye}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION_DOCKER:-database}
      SUPERVISOR_WORKER_USER: ${APP_USER:-easyeye}
      SUPERVISOR_QUEUE_CONNECTION: ${QUEUE_CONNECTION_DOCKER:-database}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - easyeye-network
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl -c /etc/supervisor/supervisord.conf status all"]
      interval: 15s
      retries: 5
      start_period: 20s
      timeout: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: easyeye_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./:/var/www/html/app
      - ./.docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - easyeye-network

  # [DOCKER-DB] Descomente para rodar PostgreSQL em container
  # db:
  #   image: postgres:17-alpine
  #   container_name: easyeye_db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-easyeye}
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "${POSTGRES_HOST_PORT:-5432}:5432"
  #   networks:
  #     - easyeye-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-easyeye}"]
  #     interval: 10s
  #     retries: 5
  #     start_period: 20s
  #     timeout: 5s

  # [DOCKER-REDIS] Descomente para rodar Redis em container
  # redis:
  #   image: redis:7-alpine
  #   container_name: easyeye_redis
  #   restart: unless-stopped
  #   command: ["redis-server", "--appendonly", "yes"]
  #   ports:
  #     - "${REDIS_HOST_PORT:-6379}:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - easyeye-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     retries: 5
  #     start_period: 20s
  #     timeout: 5s

  # Vite dev server — HMR no browser via localhost:${VITE_PORT:-5173}
  # Modo dev:   docker compose up node
  # Modo build: docker compose run --rm node npm run build
  node:
    image: node:22-alpine
    container_name: easyeye_node
    restart: unless-stopped
    working_dir: /var/www/html/app
    volumes:
      - ./:/var/www/html/app
      # Volume separado para node_modules evita conflito entre host e container
      - node_modules:/var/www/html/app/node_modules
    command: sh -c "npm install --silent && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - easyeye-network

  # Utilitários — ativados com: docker compose --profile tools run --rm <serviço>
  composer:
    build: *app-build
    profiles: ["tools"]
    working_dir: /var/www/html/app
    volumes:
      - ./:/var/www/html/app
    entrypoint: ["composer"]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - easyeye-network

  artisan:
    build: *app-build
    profiles: ["tools"]
    working_dir: /var/www/html/app
    volumes:
      - ./:/var/www/html/app
    entrypoint: ["php", "artisan"]
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - easyeye-network

networks:
  easyeye-network:
    driver: bridge

volumes:
  # node_modules em volume nomeado: evita conflito entre binários do host e do container
  node_modules:
  # Descomente junto com os blocos [DOCKER-DB] e [DOCKER-REDIS] acima
  # postgres_data:
  # redis_data:
