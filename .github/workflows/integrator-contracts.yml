name: Integrator contracts
# PR: roda só o que a mudança alcança (scripts/ci-select-tests.py). Suíte inteira em todo push para main/desenv
# (pós-merge). Sem `push` em branch de PR: o pull_request já cobre, e os dois rodavam a suíte inteira em duplicata.
#
# Jobs (num job só a suíte inteira levava 40m37s na rodada 38775084843: Vitest, build e Pest em série, o Pest com 2.206 s):
#   select          escolhe os testes, o teto de tempo e a matriz de jobs de Pest (sem banco, sem PHP)
#   assets          build do cliente uma vez (manifest do Vite); os jobs de Pest só baixam o resultado
#   frontend-tests  Vitest e o build SSR (compilado e conferido aqui, fora do caminho do Pest), em paralelo com tudo
#   quality         estilo dos arquivos alterados, em paralelo com tudo
#   php-tests       um job por fatia da matriz, cada um com o PRÓPRIO Postgres e Redis (fatias nunca dividem banco);
#                   o Pest roda serial dentro do job
#   contracts       agregador: mantém o nome do check exigido e só passa se TODAS as etapas passaram
# Teto de tempo: o passo do Pest tem o do seletor (timeout_minutes); os jobs sem Pest têm um teto FIXO no próprio job
# (apt/composer/npm/build travados não seguram o runner por 6 h).
on:
  pull_request:
  push:
    branches: [main, desenv]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # Os testes foram escritos e rodam em Brasília (dev e produção). Sem isto a CI roda em UTC e datas/horas caem um dia
  # adiante (Vitest, Billing, PDF, Manager). TZ: Node/PHP; APP_TIMEZONE: o app; PGTZ: a sessão do Postgres.
  TZ: America/Sao_Paulo
  APP_TIMEZONE: America/Sao_Paulo
  PGTZ: America/Sao_Paulo
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      pest_args: ${{ steps.select.outputs.pest_args }}
      timeout_minutes: ${{ steps.select.outputs.timeout_minutes }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        run: python3 scripts/ci-select-tests.py
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_EVENT: ${{ github.event_name }}

  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Só o build do CLIENTE (o `npm run build` ainda faria o tinymce:install e o `vite build --ssr`, que ficam fora do
      # caminho crítico dos jobs de Pest). Mesmos limites de memória do script `build` do package.json.
      - run: node node_modules/vite/bin/vite.js build
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      # Os testes PHP renderizam páginas Blade com @vite: precisam do manifest em public/build, e SÓ dele. Nenhum código PHP ou
      # teste lê public/vendor/tinymce (só o navegador) nem bootstrap/ssr (o phpunit.xml desliga o SSR nos testes). Com UM
      # caminho a raiz do artefato é o próprio public/build (upload-artifact): o download abaixo cai em public/build.
      # Sem include-hidden-files: public/build não tem arquivo oculto e o flag só alargaria o que pode entrar no pacote.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assets
          path: public/build
          if-no-files-found: error
          retention-days: 1

  frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/vitest/vitest.mjs run
      # O bundle SSR (o que `npm run build` faz depois do cliente) continua sendo compilado na CI e reprova se quebrar, mas
      # aqui, em paralelo, e não no caminho crítico dos jobs de Pest (que nunca o leem). Mesmo limite do script `build`.
      - run: node node_modules/vite/bin/vite.js build --ssr
        env:
          NODE_OPTIONS: --max-old-space-size=1536

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          # Sem redis: o composer só exige ext-calendar e o package:discover não abre conexão Redis. Quem fala com um Redis
          # de verdade é o Pest (job php-tests).
          extensions: pdo_pgsql, gd, mbstring, calendar, sodium, zip, pcntl, posix
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      # `.env` vazio: o composer inicializa o Laravel (package:discover) e, sem o arquivo, o phpdotenv emite um warning de PHP.
      - run: touch .env
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: python3 scripts/check-integrator-style.py
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  php-tests:
    name: php-tests (${{ matrix.id }})
    needs: [select, assets]
    runs-on: ubuntu-24.04
    strategy:
      # Uma fatia que falha não derruba as outras: o relatório de uma rodada mostra tudo o que quebrou.
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: easyeye_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d easyeye_test" --health-interval 10s
          --health-timeout 5s --health-retries 5
      # QueueRedisReservationTest (Integration) fala com um Redis de verdade; sem ele o teste se pula sozinho.
      redis:
        image: redis:7
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:cDItc3ludGhldGljLWtleS1vbmx5LTMyLWJ5dGVzISE=
      APP_LOCALE: pt_BR
      APP_FAKER_LOCALE: pt_BR
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: easyeye_test
      DB_USERNAME: postgres
      DB_PASSWORD: synthetic-ci-only
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: 'null'
      AI_PROVIDER_RUNTIME: fake
      AWS_ACCESS_KEY_ID: synthetic-only
      AWS_SECRET_ACCESS_KEY: synthetic-only
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: synthetic-only
      # No ambiente INICIAL do processo (definir dentro do PHP não vale): sem isto o Imagick/libgomp aquecido por um teste
      # de imagem deixa o filho do pcntl_fork preso no encerramento nativo e IntegratorP2ConcurrencyTest estoura os 10 s
      # (5 falhas na rodada 38775084843). Limita só os processos de teste; os dois processos de uma corrida seguem paralelos.
      OMP_THREAD_LIMIT: '1'
    steps:
      # Clone raso (profundidade 1): os testes só precisam de HEAD (`git rev-parse HEAD`, diff contra a árvore vazia do git),
      # e o histórico inteiro (75 MiB) seria baixado uma vez por fatia. Quem precisa de histórico é o `select` (diff contra a base).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, mbstring, calendar, sodium, zip, pcntl, posix, redis
          coverage: none
      # `.env` vazio e sintético (as variáveis vêm do `env:` acima): sem o arquivo, TODO teste que sobe o Laravel emitia um
      # warning de PHP do phpdotenv (7.713 "warnings" na rodada 38775084843). Não copiar .env.example: traz defaults que
      # os testes conferem como ausentes.
      - run: touch .env
      # poppler-utils: `pdftotext`, que ExternalMedicalReportViewTest usa para ler o texto do laudo em PDF (o runner não o traz).
      - run: sudo apt-get update && sudo apt-get install -y util-linux ghostscript poppler-utils
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assets
          path: public/build
      - run: test -f public/build/manifest.json
      - name: Pest (${{ matrix.id }})
        run: |
          mkdir -p "$JUNIT_DIR"
          args=($PEST_ARGS)
          if [ -n "$PEST_SHARD" ]; then
            args+=("--shard=$PEST_SHARD")
          fi
          php vendor/bin/pest "${args[@]}" --fail-on-empty-test-suite --compact --log-junit="$JUNIT_DIR/$MATRIX_ID.xml"
        # O teto vem do seletor (scripts/ci-select-tests.py), que sabe quanto vai rodar: 15 min para seleção pequena de PR
        # (travou = falha rápida, não 6 h); 60 min para a suíte inteira (push main/desenv OU PR de efeito amplo: migrations,
        # config, rotas, providers — a maioria dos PRs de feature) e para seleção grande. Escolher pelo evento deixava 15 min
        # para a suíte inteira de todo PR de feature. Sem a saída, 60: nunca encurta por engano. O teto vale POR JOB: cada
        # fatia leva uma fração da suíte, então 60 é folga, não meta. `needs` vale aqui (step-level).
        timeout-minutes: ${{ fromJSON(needs.select.outputs.timeout_minutes || '60') }}
        env:
          PEST_ARGS: ${{ matrix.pest_args }}
          PEST_SHARD: ${{ matrix.shard }}
          MATRIX_ID: ${{ matrix.id }}
          JUNIT_DIR: ${{ runner.temp }}/junit
      # Só o job que tem o P2ContractsTest gera as fixtures HTTP; o validador as lê no MESMO runner. Roda mesmo se outro
      # teste da fatia falhou (as fixtures já podem existir), nunca se o run foi cancelado.
      - run: php scripts/validate-integrator-contracts.php
        if: ${{ !cancelled() && matrix.fixtures }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && matrix.fixtures }}
        with:
          name: synthetic-integrator-contracts
          path: storage/framework/testing/p2
          retention-days: 14
      # JUnit por fatia (tempo por classe/caso: base para rebalancear as fatias por duração), inclusive quando falha.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-${{ matrix.id }}
          path: ${{ runner.temp }}/junit
          retention-days: 14

  # O check exigido do repositório chama-se `contracts` e continua existindo: este job o mantém. `if: always()` porque um job
  # a montante que falhou/foi cancelado/foi pulado deixaria o agregador "skipped" — e skipped não reprova a proteção de
  # branch. Nenhum dos jobs a montante é opcional: tudo que não for `success` reprova.
  contracts:
    needs: [select, assets, frontend-tests, quality, php-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Não faz checkout nem chama a API: só lê o resultado dos outros jobs pelo ambiente. Sem permissão nenhuma.
    permissions: {}
    env:
      SELECT: ${{ needs.select.result }}
      ASSETS: ${{ needs.assets.result }}
      FRONTEND_TESTS: ${{ needs.frontend-tests.result }}
      QUALITY: ${{ needs.quality.result }}
      PHP_TESTS: ${{ needs.php-tests.result }}
    steps:
      - run: |
          status=0
          for job in SELECT ASSETS FRONTEND_TESTS QUALITY PHP_TESTS; do
            result="${!job}"
            echo "$job: ${result:-sem resultado}"
            if [ "$result" != success ]; then
              status=1
            fi
          done
          exit "$status"
