                  type: boolean
                dicom_mwl:
                  type: boolean
                ocr:
                  type: boolean
                rpa:
                  type: boolean
            watcher_state:
              type: string
              enum:
              - unknown
              - active
              - inactive
              nullable: true
            mwl_state:
              type: string
              enum:
              - unknown
              - active
              - inactive
              nullable: true
            ingest_pending:
              type: integer
              minimum: 0
            quarantined:
              type: integer
              minimum: 0
            acquisition_rejected:
              type: integer
              minimum: 0
            unconfirmed_sent:
              type: integer
              minimum: 0
            originals_pending_remote_archive:
              type: integer
              minimum: 0
            oldest_pending_at:
              type: string
              format: date-time
              nullable: true
            disk_free_bytes:
              type: integer
              minimum: 0
            devices:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                properties:
                  equipment_id:
                    type: integer
                    minimum: 1
                  remote_equipment_id:
                    type: string
                    format: uuid
                    nullable: true
                  last_observed_at:
                    type: string
                    format: date-time
                    nullable: true
                  last_accepted_at:
                    type: string
                    format: date-time
                    nullable: true
                  rejected_count:
                    type: integer
                    minimum: 0
                  issue:
                    type: string
                    enum:
                    - dicom_invalid_or_unavailable
                    - source_or_spool_unavailable
                    - upload_size_exceeded
                    - unsupported_file_type
                    - format_incomplete
                    - file_not_ready
                    - pdf_tools_unavailable
                    - pdf_parse_failed
                    - pdf_identity_conflict
                    - pdf_resource_limit
                    - emr_invalid_structure
                    - emr_duplicate_field
                    - emr_unsupported_field
                    - emr_encoding_invalid
                    nullable: true
            next_action:
              type: string
            configuration_sync:
              type: object
              additionalProperties: false
              properties:
                pending:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                needs_review:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                last_success_at:
                  type: string
                  format: date-time
                  nullable: true
              required:
              - pending
              - needs_review
            worklist:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                properties:
                  equipment_id:
                    type: integer
                    minimum: 1
                  state:
                    type: string
                    enum:
                    - fresh
                    - offline_snapshot
                    - blocked
                    - unavailable
                    - refresh_failed
                  source:
                    type: string
                    enum:
                    - snapshot_api
                    - cache
                    - policy
                    - api
                  fetched_at:
                    type: string
                    format: date-time
                    nullable: true
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  resource_id:
                    type: string
                    format: uuid
                    nullable: true
                  last_error_code:
                    type: string
                    enum:
                    - resource_required
                    - agenda_unavailable
                    - snapshot_refresh_failed
                    nullable: true
                required:
                - equipment_id
                - state
                - source
            update:
              type: object
              additionalProperties: false
              properties:
                state:
                  type: string
                  enum:
                  - not_configured
                  - prepared
                  - downloaded
                  - installing
                  - awaiting_restart
                  - reboot_required
                  - failed
                  - installed
                  nullable: true
                channel:
                  type: string
                  enum:
                  - pilot
                  - stable
                  nullable: true
                cohort:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                  nullable: true
                installed_version:
                  type: string
                  maxLength: 32
                  nullable: true
                  pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[A-Za-z0-9.-]+)?$
                last_error_code:
                  type: string
                  enum:
                  - interrupted_installation_review_required
                  - installer_failed
                  - installer_outcome_uncertain
                  - installer_not_started
                  - operator_recovery_confirmed
                  nullable: true
          required:
          - version
          - scope
          - ingest_pending
          - quarantined
          - acquisition_rejected
          - devices
          - next_action
          nullable: true
      required:
      - pending_count
      - failed_count
      - blocked_count
      - sent_last_24h_count
      - problems
      description: Bounded legacy problem input is accepted, but patient/schedule identifiers and free error text are
        never persisted or returned. File names become a server-secret HMAC technical reference. Only counters, timestamps,
        typed issue codes and HTTP status survive. Current stale snapshot minimized after30days; aggregate trend retained7days.

