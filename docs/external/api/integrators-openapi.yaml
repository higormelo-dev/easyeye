            - file_name
            - status
            - attempts
            - updated_at
        operational:
          type: object
          additionalProperties: false
          properties:
            version:
              type: string
              maxLength: 32
              pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[A-Za-z0-9.-]+)?$
